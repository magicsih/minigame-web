<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minigames</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f2f2f2;
        margin: 0;
        padding: 0;
      }

      h1 {
        text-align: center;
        margin-top: 50px;
      }

      .game-list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 18px;
        padding: 20px;
        max-width: 1100px;
        margin: 50px auto 0;
        box-sizing: border-box;
      }

      .game-card {
        background: linear-gradient(135deg, #e6e6ff, #f2e6ff);
        border-radius: 10px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: transform 0.18s ease, box-shadow 0.18s ease;
        text-decoration: none;
        padding: 12px;
        min-height: 160px;
        width: 100%;
        height: 100%;
        box-sizing: border-box;
      }

      .game-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
      }

      .game-card img {
        max-width: 80%;
        max-height: 80%;
      }

      .game-card .label {
        font-size: 24px;
        font-weight: bold;
        color: #333;
        text-align: center;
        padding: 10px;
        word-break: keep-all;
        display: block;
        width: 100%;
      }

      @media (max-width: 600px) {
        h1 {
          margin-top: 30px;
          font-size: 20px;
        }
        .game-list {
          gap: 14px;
          padding: 12px;
          grid-template-columns: 1fr;
          margin-top: 30px;
        }
        .game-card {
          min-height: 120px;
          padding: 12px;
        }
        .game-card .label {
          font-size: 20px;
          padding: 6px;
        }
      }
    </style>
  </head>
  <body>
    <h1>Minigames</h1>
    <div class="game-list">
      <a href="/2048" class="game-card">
        <span class="label">2048</span>
      </a>
      <a href="/maze" class="game-card">
        <span class="label">Maze</span>
      </a>
      <a href="/snake" class="game-card">
        <span class="label">Snake</span>
      </a>
      <a href="/farm" class="game-card">
        <span class="label">Farm</span>
      </a>
      <!-- Add more game cards here -->
    </div>
  </body>
</html>
